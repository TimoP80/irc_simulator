        function renderCssAnalysis() {
            const container = document.getElementById('css-analysis');
            let content = '';
            for (const file in cssData) {
                content += `<h3>${file}</h3>`;
                content += '<table><thead><tr><th>Selector</th><th>Properties</th></tr></thead><tbody>';
                cssData[file].forEach(rule => {
                    if (rule.rules) { // Media query
                        content += `<tr><td colspan="2"><code>${rule.selector}</code></td></tr>`;
                        rule.rules.forEach(innerRule => {
                            let props = '<ul>';
                            for (const prop in innerRule.properties) {
                                props += `<li><code>${prop}</code>: ${innerRule.properties[prop]}</li>`;
                            }
                            props += '</ul>';
                            content += `<tr><td><code>&nbsp;&nbsp;${innerRule.selector}</code></td><td>${props}</td></tr>`;
                        });
                    } else if (rule.steps) { // Keyframes
                        content += `<tr><td><code>${rule.selector}</code></td><td><pre>${rule.steps}</pre></td></tr>`;
                    } else {
                        let props = '<ul>';
                        for (const prop in rule.properties) {
                            props += `<li><code>${prop}</code>: ${rule.properties[prop]}</li>`;
                        }
                        props += '</ul>';
                        content += `<tr><td><code>${rule.selector}</code></td><td>${props}</td></tr>`;
                    }
                });
                content += '</tbody></table>';
            }
            container.innerHTML = content;
        }

        function renderHtmlAnalysis() {
            const container = document.getElementById('html-analysis');
            let content = '<table><thead><tr><th>HTML Element</th><th>Attributes</th></tr></thead><tbody>';
            for (const tag in htmlData) {
                content += `<tr><td><code><${tag}></code></td><td>`;
                if (htmlData[tag].length > 0) {
                    content += '<ul class="attributes">';
                    htmlData[tag].forEach(attr => {
                        content += `<li>${attr}</li>`;
                    });
                    content += '</ul>';
                } else {
                    content += 'N/A';
                }
                content += '</td></tr>';
            }
            content += '</tbody></table>';
            container.innerHTML = content;
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderCssAnalysis();
            renderHtmlAnalysis();
        });
    </script>
